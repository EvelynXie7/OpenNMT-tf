# --- where to write checkpoints + TensorBoard logs ---
model_dir: runs/enzh_transformer_spm32k
auto_config: true

# --- data ---
data:
  train_features_file: data/en-zh-new/train.en
  train_labels_file:   data/en-zh-new/train.zh
  eval_features_file:  data/en-zh-new/valid.en
  eval_labels_file:    data/en-zh-new/valid.zh

  # shared SentencePiece vocab 
  source_vocabulary: data/en-zh-new/src.vocab
  target_vocabulary: data/en-zh-new/tgt.vocab

# --- tokenization (joint SP model) ---
tokenization:
  type: SentencePieceTokenizer
  params:
    model_path: data/en-zh-new/spm32k.model

# model & inference params (Transformer-base-ish) 
params:
  optimizer: Adam
  learning_rate: 2.0
  decay_type: NoamDecay
  decay_params: { model_dim: 512, warmup_steps: 8000 }
  label_smoothing: 0.1
  beam_width: 4
  maximum_decoding_length: 256
 

# training 
train:
  batch_type: tokens
  batch_size: 4096
  maximum_features_length: 256
  maximum_labels_length: 256
  save_checkpoints_steps: 2000
  keep_checkpoint_max: 8
  save_summary_steps: 100
  max_step: 300000           # early stopping will halt earlier if BLEU stalls

# evaluation 
eval:
  steps: 2000                 # evaluate every N train steps
  batch_type: tokens
  batch_size: 2048
  scorers: bleu               # compute BLEU on valid set
  export_on_best: bleu        # auto-export best model
  early_stopping:             # stop when BLEU stops improving
    metric: bleu
    min_improvement: 0.1      # require +0.1 BLEU improvement
    steps: 5                  # patience = 5 evals without improvement
    
infer:
  batch_type: tokens
  batch_size: 256
